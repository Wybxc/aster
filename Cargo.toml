[package]
name = "aster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comemo = "0.5"
cssparser = "0.37"
data-url = "0.3"
futures-util = "0.3"
include_dir = "0.7"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler", "browserslist"] }
mime_guess = "2"
notify-debouncer-full = "0.7"
poem = { version = "3.1", default-features = false, features = ["server", "sse", "static-files"] }
scopeguard = "1.2"
seahash = "4.1.0"
serde = { version = "1", features = ["derive"] }
syntect = { version = "5.3", features = ["default-syntaxes", "default-themes", "dump-load"] }
termcolor = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
toml = "1.1"
typst = "0.15.1"
typst-eval = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "emit-diagnostics", "scan-fonts", "system-downloader", "system-files"] }
typst-library = "0.15.1"
typst-svg = "0.15.1"
url = "2.5"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
