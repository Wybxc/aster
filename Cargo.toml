[package]
name = "aster-ssg"
version = "0.1.0"
edition = "2024"

[lib]
name = "aster"
path = "src/lib.rs"

[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
comemo = "0.5"
cssparser = "0.37"
data-url = "0.3"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
include_dir = "0.7"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler", "browserslist"] }
lumis-core = { version = "2.3.0", default-features = false }
lumis-wasm-runtime = "0.1.0"
mime_guess = "2"
notify-debouncer-full = "0.7"
oxipng = { version = "10.1.1", default-features = false }
poem = { version = "3.1", default-features = false, features = ["server", "sse", "static-files"] }
parse-srcset = "0.1.1"
scopeguard = "1.2"
seahash = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
termcolor = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
toml = "1.1"
typst = "0.15.1"
typst-eval = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "emit-diagnostics", "scan-fonts", "system-downloader", "system-files"] }
typst-library = "0.15.1"
typst-svg = "0.15.1"
url = "2.5"
walkdir = "2.5"
