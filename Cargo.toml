[package]
name = "aster-ssg"
version = "0.1.2"
edition = "2024"
description = "A typst-native static site generator, inspired by Astro."
license = "Apache-2.0"
documentation = "https://docs.rs/aster-ssg"
homepage = "http://wybxc.github.io/aster/"
repository = "https://github.com/Wybxc/aster"

[lib]
name = "aster"
path = "src/lib.rs"

[[bin]]
name = "aster"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
anyhow = "1"
anstyle = "1"
clap = { version = "4", features = ["derive"] }
comemo = "0.5"
cssparser = "0.37"
data-url = "0.3"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
include_dir = "0.7"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler", "browserslist"] }
lumis-core = { version = "2.4.0", default-features = false }
lumis-wasm-runtime = "=0.2.0"
mime_guess = "2"
notify-debouncer-full = "0.7"
oxipng = { version = "10.1.1", default-features = false }
poem = { version = "3.1", default-features = false, features = ["server", "sse", "static-files"] }
parse-srcset = "0.1.1"
scopeguard = "1.2"
seahash = "4.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
termcolor = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
typst = "0.15.1"
typst-eval = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "emit-diagnostics", "scan-fonts", "system-files"] }
# Downloads Typst Universe packages with rustls, so cross-compiled release
# binaries never link against a system OpenSSL.
ureq = { version = "3", features = ["rustls"], default-features = false }
typst-library = "0.15.1"
typst-svg = "0.15.1"
typst-utils = "0.15.1"
url = "2.5"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = true

# Asset naming produced by the upload-rust-binary-action jobs in
# .github/workflows/release-plz.yml (every release) and release-binaries.yml
# (manual backfill), so `cargo binstall aster-ssg` downloads the prebuilt
# binary from GitHub Releases.
[package.metadata.binstall]
pkg-url = "{repo}/releases/download/v{version}/aster-{target}.{archive-format}"
